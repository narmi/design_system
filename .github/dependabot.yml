# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 7
      semver-major-days: 30
    ignore:
      # v10 of the preset needs conventional-changelog-writer@9, but
      # @semantic-release/release-notes-generator still ships writer@8.
      # The mismatch breaks the Release action at `generateNotes`. Drop this
      # once release-notes-generator depends on writer@9 or newer.
      - dependency-name: "conventional-changelog-conventionalcommits"
        update-types: ["version-update:semver-major"]
    groups:
      # react-aria-components pins exact versions of react-aria and
      # react-stately. Bumping them separately would bundle two copies.
      react-aria:
        patterns:
          - "react-aria"
          - "react-aria-components"
          - "react-stately"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      # github-actions doesn't support semver,
      # so `semver-major-days` will be ignored.
      # using biweekly updates as a compromise.
      default-days: 14
