# Updates snapshots in chromatic, using latest `main` as basleline
name: 'Chromatic Snapshot Baseline'
permissions:
  contents: read
on:
  push:
    branches:
      - main

jobs:
  chromatic_update_baseline:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: pnpm run build && pnpm run build-storybook

      - name: Auto-accept chromatic snapshots from `main`
        uses: chromaui/action@2a0b63f30233c48591844a46d451b9cf68128186 # 18.7.2
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          autoAcceptChanges: true
          exitZeroOnChanges: false
          buildScriptName: ''
          storybookBuildDir: './storybook-static'
