name: Dependabot PR Analysis

# pull_request_target is needed for secrets on Dependabot PRs; PR code is never checked out.
# The agent gets a read-only token; a separate job posts its analysis.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number of the Dependabot PR to analyze"
        required: true
        type: number

permissions: {}

jobs:
  resolve-pr:
    name: Resolve PR number
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      base_ref: ${{ steps.resolve.outputs.base_ref }}
    steps:
      - name: Resolve PR metadata
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PR_NUMBER="$INPUT_PR_NUMBER"
            BASE_REF=$(gh pr view "$PR_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --json baseRefName --jq '.baseRefName')
          else
            PR_NUMBER="$EVENT_PR_NUMBER"
            BASE_REF="$EVENT_BASE_REF"
          fi
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number: $PR_NUMBER"
            exit 1
          fi
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "base_ref=${BASE_REF}" >> "$GITHUB_OUTPUT"

  analyze:
    name: "Analyze Dependabot PR #${{ needs.resolve-pr.outputs.pr_number }}"
    needs: resolve-pr
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-pr.outputs.base_ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Pinned since it runs with AWS credentials; Dependabot won't bump it.
      - name: Install opencode
        run: npm install -g opencode-ai@1.18.35 # zizmor: ignore[adhoc-packages]

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::848180528913:role/GitHubActionsBedrock
          aws-region: us-east-1
          role-duration-seconds: 1800

      - name: Run dependency analysis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr_number }}
        run: |
          # Defense in depth only; still recoverable via /proc or sudo.
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN

          COMMENT_FILE="$GITHUB_WORKSPACE/dependabot-analysis-comment.md"

          PROMPT=$(cat <<'PROMPT'
          Analyze Dependabot pull request #__PR_NUMBER__ in __REPO__.

          ## Your Task
          Analyze this dependency update and write up your findings as a comment for the PR.

          ## Step 1: Gather PR Context
          Run these commands to understand what is being updated:

              gh pr view __PR_NUMBER__ --repo "__REPO__" --json title,body,files
              gh pr diff __PR_NUMBER__ --repo "__REPO__"

          From the PR title and body, identify:
          - The dependency name(s) being updated
          - The old and new version(s)
          - The ecosystem (npm, Python/uv, GitHub Actions)
          - Whether this is a single dependency or a grouped update

          ## Step 2: Research the Update
          Based on the ecosystem, research what changed between the old and new versions:
          - For npm packages: run `npm view <package> repository.url` to find the source repo,
            then fetch recent releases with `gh api repos/<owner>/<repo>/releases`
          - For Python packages: check PyPI at https://pypi.org/project/<package>/#history
          - For GitHub Actions: check the action's repository for release notes
          - Review the Dependabot PR body which typically includes release notes and changelog

          Determine if this is a patch, minor, or major version bump and whether it
          includes security fixes, breaking changes, or deprecations.

          ## Step 3: Analyze Usage in the Codebase
          This is the most important step. Thoroughly search the codebase to understand
          how this dependency is actually used:

          - Search for all imports, requires, and references to the dependency
          - Identify which files and modules depend on it
          - Check if any of the specific APIs or features that changed between versions
            are used in this codebase
          - Note how heavily the dependency is used (a few files vs. widespread)

          Be thorough - use grep, find, and read the relevant source files to understand
          the actual usage patterns. Do not just report surface-level import counts.

          ## Step 4: Write Your Analysis
          Write your comment as Markdown to this file, and nowhere else:

              __COMMENT_FILE__

          Use your file-writing tool. Do NOT post the comment yourself: you only have
          read access to GitHub, and a separate step posts this file to the PR after
          you finish. If you write the file from the shell instead, use a quoted
          heredoc (cat > FILE <<'COMMENT_EOF') so backticks and $(...) in your
          Markdown are not run as commands.

          Your comment MUST follow this exact format:

          ## Dependabot Dependency Analysis

          ### Summary
          <1-3 sentence summary of the update>

          ### Key Changes (old version → new version)
          <bullet list of the most important changes: breaking changes, security fixes,
          new features, deprecations, bug fixes>

          ### Usage in This Repository
          <Detailed analysis of how the dependency is used in the codebase.
          List specific files and patterns. Note which changed APIs are used here.>

          ### Risk Assessment
          **Risk Level:** LOW | MEDIUM | HIGH

          <Justification considering: version bump type, breaking changes affecting our
          usage, security implications, breadth of usage in codebase>

          ### Recommendation
          One of:
          - **Safe to merge** — <reason>
          - **Review recommended** — <reason>
          - **Manual testing required** — <reason>

          IMPORTANT: You MUST write the file. Do not skip this step.

          IMPORTANT: Your comment MUST NOT contain any "#<number>" patterns (e.g. #123, #456).
          GitHub automatically converts these into links to PRs/issues in THIS repository,
          which is incorrect since those numbers refer to a different upstream repository.
          Instead, reference upstream issues/PRs using their full URL or descriptive text
          (e.g. "issue 123 in <repo>" or the full GitHub URL).
          PROMPT
          )
          PROMPT="${PROMPT//__PR_NUMBER__/$PR_NUMBER}"
          PROMPT="${PROMPT//__REPO__/$GITHUB_REPOSITORY}"
          PROMPT="${PROMPT//__COMMENT_FILE__/$COMMENT_FILE}"

          opencode run \
            --model amazon-bedrock/anthropic.claude-opus-5-5 \
            "$PROMPT"

          if [ ! -s "$COMMENT_FILE" ]; then
            echo "::error::The agent did not write $COMMENT_FILE"
            exit 1
          fi
          if [ "$(wc -m < "$COMMENT_FILE")" -gt 65536 ]; then
            echo "::error::The analysis is longer than GitHub's comment limit"
            exit 1
          fi

      - name: Upload analysis
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependabot-analysis-comment
          path: dependabot-analysis-comment.md
          if-no-files-found: error
          retention-days: 1

  post-comment:
    name: Post analysis comment
    needs: [resolve-pr, analyze]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    timeout-minutes: 5

    steps:
      - name: Download analysis
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependabot-analysis-comment
          path: ${{ runner.temp }}/analysis

      - name: Post comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr_number }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file "$RUNNER_TEMP/analysis/dependabot-analysis-comment.md"
