name: Figma Variables Sync

on:
  workflow_dispatch:
    inputs:
      file_key:
        description: 'Figma file key (from the file URL)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  fetch-figma-variables:
    name: (Beta) Fetch Figma Variables
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Fetch Figma variables
        env:
          FIGMA_TOKEN: ${{ secrets.NDS_FIGMA_TOKEN }}
          FILE_KEY: ${{ github.event.inputs.file_key }}
        run: |
          node ./scripts/figma-variables.mjs "$FILE_KEY"
