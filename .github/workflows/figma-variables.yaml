name: Figma Variables Sync

on:
  workflow_dispatch:
    inputs:
      file_key:
        description: 'Figma file key (from the file URL)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  fetch-figma-variables:
    name: (Beta) Fetch Figma Variables
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Fetch Figma variables
        env:
          FIGMA_TOKEN: ${{ secrets.NDS_FIGMA_TOKEN }}
          FILE_KEY: ${{ github.event.inputs.file_key }}
        run: |
          node ./scripts/figma-variables.mjs "$FILE_KEY"
