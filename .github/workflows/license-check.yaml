name: Check License
on: [pull_request]
permissions:
  contents: read
jobs:
  Check-license:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version-file: ".nvmrc"
          registry-url: https://registry.npmjs.org
      - run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build
      # Each license string pnpm reports must appear verbatim in the allowlist,
      # including compound expressions like `(MIT OR Apache-2.0)`.
      - name: Check licenses against allowlist
        run: |
          licenses=$(pnpm licenses list --json | jq -re 'keys[]')
          bad=$(grep -vxF -f .github/allowed-licenses.txt <<< "$licenses") || true
          [ -z "$bad" ] || { echo "Disallowed licenses:"; echo "$bad"; exit 1; }
