name: Check License
on: [pull_request]
permissions:
  contents: read
jobs:
  Check-license:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version-file: ".nvmrc"
          registry-url: https://registry.npmjs.org
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      # Each license string pnpm reports must appear verbatim in the allowlist,
      # including compound expressions like `(MIT OR Apache-2.0)`.
      - name: Check licenses against allowlist
        shell: bash
        run: |
          licenses=$(pnpm licenses list --json | jq -re 'keys[]')
          # grep exits 0 if any license is not allowlisted, 1 if all are,
          # and 2 on error (e.g. a missing allowlist), which must also fail.
          status=0
          bad=$(grep -vxF -f .github/allowed-licenses.txt <<< "$licenses") || status=$?
          [ "$status" -le 1 ] || exit "$status"
          [ "$status" -eq 1 ] || { echo "Disallowed licenses:"; echo "$bad"; exit 1; }
