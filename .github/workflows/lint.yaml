name: Lint
on: [pull_request]
permissions:
  contents: read
jobs:
  run-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version-file: ".nvmrc"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check generated icon names are in sync
        run: |
          node scripts/buildIconNames.mjs
          git diff --exit-code src/icons/iconNames.ts

      - name: eslint
        run: |
          echo "The job was automatically triggered by a ${{ github.event_name }} event."
          npm run lint

  run-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version-file: ".nvmrc"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # `npm run build` runs `tsc`, but only inside jobs that are skipped on a
      # `dist` cache hit. This runs the type checker unconditionally, and over
      # every file in `src/` rather than just the `src/index.ts` entry graph.
      - name: tsc
        run: npm run typecheck

      # Storybook's react-docgen-typescript pipeline fails silently when its
      # tsconfig stops covering `src/`, leaving every TS component without
      # controls or prop descriptions. See scripts/checkDocgen.mjs.
      - name: Storybook docgen
        run: npm run check:docgen
