name: Release
on:
  push:
    branches:
      - main
      - '[0-9]*.[0-9]*.x'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      # When release-backport.yaml creates a maintenance branch, it copies
      # this file from `main` onto a tag that may predate the pnpm migration
      # and only have `package-lock.json`, so detect which lockfile is present.
      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "name=pnpm" >> "$GITHUB_OUTPUT"; else echo "name=npm" >> "$GITHUB_OUTPUT"; fi

      - name: Install pnpm
        if: steps.pm.outputs.name == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        env:
          PM: ${{ steps.pm.outputs.name }}
        run: |
          if [ "$PM" = pnpm ]; then pnpm install --frozen-lockfile --ignore-scripts; else npm ci --ignore-scripts; fi

      - name: Build Dist
        env:
          PM: ${{ steps.pm.outputs.name }}
        run: $PM run build

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    environment: Publish
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # When release-backport.yaml creates a maintenance branch, it copies
      # this file from `main` onto a tag that may predate the pnpm migration
      # and only have `package-lock.json`, so detect which lockfile is present.
      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "name=pnpm" >> "$GITHUB_OUTPUT"; else echo "name=npm" >> "$GITHUB_OUTPUT"; fi

      - name: Install pnpm
        if: steps.pm.outputs.name == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version-file: ".nvmrc"
      - name: Install release dependencies without lifecycle scripts
        env:
          PM: ${{ steps.pm.outputs.name }}
        run: |
          if [ "$PM" = pnpm ]; then pnpm install --frozen-lockfile --ignore-scripts; else npm ci --ignore-scripts; fi

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Release
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
        run: npx semantic-release --verbose
