name: Release
on:
  push:
    branches:
      - main
      - '[0-9]*.[0-9]*.x'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      # Maintenance branches for lines older than v6.35 carry a copy of this
      # file from `main` on top of a tag that may predate the pnpm migration
      # and only have `package-lock.json`, so detect which lockfile is present.
      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "name=pnpm" >> "$GITHUB_OUTPUT"; else echo "name=npm" >> "$GITHUB_OUTPUT"; fi

      - name: Install pnpm
        if: steps.pm.outputs.name == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        env:
          PM: ${{ steps.pm.outputs.name }}
        run: |
          if [ "$PM" = pnpm ]; then pnpm install --frozen-lockfile --ignore-scripts; else npm ci --ignore-scripts; fi

      - name: Build Dist
        env:
          PM: ${{ steps.pm.outputs.name }}
        run: $PM run build

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    environment: Publish
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # Maintenance branches for lines older than v6.35 carry a copy of this
      # file from `main` on top of a tag that may predate the pnpm migration
      # and only have `package-lock.json`, so detect which lockfile is present.
      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then echo "name=pnpm" >> "$GITHUB_OUTPUT"; else echo "name=npm" >> "$GITHUB_OUTPUT"; fi

      - name: Install pnpm
        if: steps.pm.outputs.name == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version-file: ".nvmrc"
      - name: Install release dependencies without lifecycle scripts
        env:
          PM: ${{ steps.pm.outputs.name }}
        run: |
          if [ "$PM" = pnpm ]; then pnpm install --frozen-lockfile --ignore-scripts; else npm ci --ignore-scripts; fi

      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Release
        if: success()
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx semantic-release --verbose
