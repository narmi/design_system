# Renders every story in headless Chromium through the Storybook Vitest addon
# and fails on axe accessibility violations reported by @storybook/addon-a11y.
# See contributing/accessibility-tests.md.
name: Storybook Accessibility
permissions:
  contents: read
concurrency:
  group: storybook-a11y-${{ github.event.pull_request.number }}
  cancel-in-progress: true
on: [pull_request]
jobs:
  run-storybook-a11y:
    name: Storybook a11y
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Stories alias into `dist` (compiled tokens and helper classes), so the
      # library build is needed. The cache key is shared with the Chromatic and
      # Vitest workflows, so a hit here means no rebuild for this job.
      - name: Cache build
        id: build-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: dist
          key: build-${{ hashFiles('src/**', 'tokens/**', 'pnpm-lock.yaml') }}

      - name: Build
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: pnpm run build

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      # The browser binary is cached above, but its system packages are not.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run story tests
        run: pnpm run test:storybook
